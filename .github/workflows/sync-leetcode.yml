name: Sync LeetCode

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        # The noreply address makes these commits count on your contribution graph.
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - name: Pull new accepted submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync.py

      # These run even when the sync step fails, so that submissions already
      # committed before the failure still get pushed instead of being lost.
      - name: Update solutions index
        if: always()
        run: |
          python scripts/make_index.py
          git add README.md
          git diff --cached --quiet || git commit -m "Update solutions index"

      - name: Push
        if: always()
        run: git push
